<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-label="Netro — builder and tinkerer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#38bdf8;#a78bfa;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a78bfa;#8b5cf6;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      @keyframes fade { 0%,100%{opacity:0} 10%,90%{opacity:1} }
      .line{animation:fade 8s infinite}
      .l1{animation-delay:0s}.l2{animation-delay:2s}.l3{animation-delay:4s}.l4{animation-delay:6s}
    </style>
  </defs>

  <rect width="1000" height="200" rx="18" fill="#0b0d12"/>
  <rect x="1" y="1" width="998" height="198" rx="17" fill="none" stroke="url(#g)" stroke-width="2"/>

  <!-- animated sweep line along the bottom -->
  <rect x="1" y="196" width="998" height="2" rx="1" fill="url(#sweep)" opacity="0.7"/>

  <!-- pulsing avatar circle -->
  <circle cx="90" cy="100" r="46" fill="none" stroke="url(#g)" stroke-width="4">
    <animate attributeName="r" values="46;50;46" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="90" y="114" text-anchor="middle" font-family="monospace" font-size="42" font-weight="700" fill="url(#g)">N</text>

  <text x="160" y="98" font-family="system-ui,sans-serif" font-size="48" font-weight="700" fill="#eef1ff">Netro</text>

  <!-- rotating subtitles -->
  <g font-family="system-ui,sans-serif" font-size="21" fill="#8e96b8">
    <text class="line l1" x="162" y="136">自己动手做网关</text>
    <text class="line l2" x="162" y="136">把代理折腾到能跑</text>
    <text class="line l3" x="162" y="136">写自己用的工具</text>
    <text class="line l4" x="162" y="136">持续构建，保持好奇</text>
  </g>

  <text x="820" y="104" font-family="monospace" font-size="18" fill="#8e96b8">howtofix.id</text>
</svg>
